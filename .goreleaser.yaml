version: 2

project_name: prox

builds:
  - id: prox
    main: ./cmd/prox
    binary: prox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: prox
    ids:
      - prox
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.json

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    ids:
      - prox
    package_name: prox
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: prox contributors
    homepage: https://github.com/luhuadong/prox
    maintainer: luhuadong <luhuadong@163.com>
    description: Safe and diagnosable proxy environment manager for Linux terminals
    license: Apache-2.0
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    contents:
      - src: internal/shell/completion.bash
        dst: /usr/share/bash-completion/completions/prox

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^docs:"
      - "^test:"
